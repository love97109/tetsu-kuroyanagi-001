<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑柳徹包裝標籤貼紙 (029) L1290 (2x24 欄位)</title>
    <!-- Tailwind CSS for UI controls -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        :root {
            --title-font-size: 12.5pt;
            --model-font-size: 9.5pt;
            --offset-y: 0mm;
            --offset-x: 0mm;
            --preview-scale: 0.9;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            color: #334155;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Spec: A4 210mm x 297mm, 2 cols x 24 rows, 90mm x 12mm per label */
        /* Top/Bottom Margin: 4.5mm, Left/Right Margin: 14mm, Col Gap: 2mm, Row Gap: 0mm */
        .a4-sheet {
            width: 210mm;
            height: 297mm;
            padding-top: 4.5mm;
            padding-bottom: 4.5mm;
            padding-left: 14mm;
            padding-right: 14mm;
            box-sizing: border-box;
            background-color: #ffffff;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transform-origin: top center;
            transform: scale(var(--preview-scale));
        }

        .label-grid {
            display: grid;
            grid-template-columns: repeat(2, 90mm);
            grid-template-rows: repeat(24, 12mm);
            column-gap: 2mm;
            row-gap: 0mm;
            width: 182mm;
            height: 288mm;
        }

        .label-cell {
            width: 90mm;
            height: 12mm;
            box-sizing: border-box;
            border: 1px dashed #cbd5e1; /* Visual guide on screen */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0 2.5mm;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease;
        }

        .label-cell:hover {
            background-color: #f8fafc;
            border-color: #3b82f6;
        }

        .label-cell.disabled {
            background-color: #f1f5f9;
            background-image: repeating-linear-gradient(45deg, #e2e8f0, #e2e8f0 10px, #f1f5f9 10px, #f1f5f9 20px);
            opacity: 0.6;
        }

        .label-cell.disabled .label-content {
            visibility: hidden;
        }

        .label-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            transform: translate(var(--offset-x), var(--offset-y));
            pointer-events: none;
            line-height: 1.2;
        }

        /* Title style (Left side) */
        .label-title {
            font-size: var(--title-font-size);
            font-weight: 700;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .label-title.is-red-text {
            color: #dc2626 !important;
        }

        /* Model style (Right side) */
        .label-model {
            font-size: var(--model-font-size);
            font-weight: 500;
            color: #334155;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 4px;
            text-align: right;
        }

        /* Label Index Badge for user convenience */
        .cell-badge {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 7pt;
            color: #94a3b8;
            font-family: monospace;
            pointer-events: none;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            html, body {
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
                overflow: hidden !important;
            }

            /* Hide all interactive UI elements */
            .no-print {
                display: none !important;
            }

            .main-container {
                padding: 0 !important;
                margin: 0 !important;
                max-width: none !important;
            }

            /* Ensure sheet has zero shadow and fixed dimension */
            .a4-sheet {
                box-shadow: none !important;
                margin: 0 !important;
                padding-top: 4.5mm !important;
                padding-bottom: 4.5mm !important;
                padding-left: 14mm !important;
                padding-right: 14mm !important;
                transform: scale(1) !important;
                page-break-after: avoid !important;
                break-after: avoid !important;
            }

            /* Hide cell borders and badges in print output */
            .label-cell {
                border: none !important;
                background: transparent !important;
            }

            .cell-badge {
                display: none !important;
            }

            /* Ensure clean dark text for printing */
            .label-title, .label-model {
                color: #000000 !important;
            }

            .label-title.is-red-text {
                color: #dc2626 !important;
            }
        }
    </style>
</head>
<body class="min-h-screen">

    <div class="main-container max-w-7xl mx-auto p-4 lg:p-6">
        
        <!-- Header (Screen only) -->
        <header class="no-print mb-6 flex flex-wrap justify-between items-center bg-white p-4 lg:p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
            <div>
                <h1 class="text-xl lg:text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-print text-blue-600"></i>
                    黑柳徹包裝標籤貼紙 (029) L1290
                </h1>
                <p class="text-xs lg:text-sm text-slate-500 mt-1">
                    適用規格：A4 2x24 欄位 (共 48 格) ｜ 單格 90mm x 12mm ｜ 單行左右對齊排版
                </p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="resetDefaults()" class="px-3 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-left"></i> 重設預設值
                </button>
                <button onclick="window.print()" class="px-5 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-xl shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> 立即列印
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Left Control Panel (Screen only) -->
            <div class="no-print lg:col-span-4 space-y-5">
                
                <!-- Card 1: Input Content -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-100 pb-2">
                        <i class="fa-solid fa-pen-to-square text-blue-600"></i> 套印內容設定
                    </h2>
                    
                    <div class="space-y-4">
                        <!-- 快速選擇預設品項 -->
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label for="productSelect" class="block text-xs font-semibold text-slate-600">快速選取常用品項</label>
                                <button onclick="reloadSheetData()" class="text-[11px] font-medium text-blue-600 hover:text-blue-800 flex items-center gap-1 transition">
                                    <i class="fa-solid fa-rotate-right"></i> 重新整理載入資料
                                </button>
                            </div>
                            <select id="productSelect" onchange="handleProductSelect(this.value)" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white text-slate-700">
                                <option value="0">載入中...</option>
                            </select>
                            <span id="sheetStatusText" class="text-[11px] text-slate-400 mt-1 block">連線中...</span>
                        </div>

                        <div>
                            <label for="inputTitle" class="block text-xs font-semibold text-slate-600 mb-1">左側：產品名稱 / 主標題</label>
                            <input type="text" id="inputTitle" value="⛔湯勺為不沾塗層，請使用海綿清洗 !" placeholder="例如：⛔湯勺為不沾塗層，請使用海綿清洗 !" 
                                oninput="updateLabels()" 
                                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>

                        <div>
                            <label for="inputModel" class="block text-xs font-semibold text-slate-600 mb-1">右側：產品型號 / 副標題</label>
                            <input type="text" id="inputModel" value="" placeholder="例如：FN-511RRT (可留空)" 
                                oninput="updateLabels()" 
                                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>
                    </div>
                </div>

                <!-- Card 2: Fine Tuning Controls -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-100 pb-2">
                        <i class="fa-solid fa-sliders text-blue-600"></i> 排版與列印微調
                    </h2>
                    
                    <div class="space-y-4">
                        <!-- Font Size Adjustments -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-xs font-semibold text-slate-600">主標題字級</label>
                                    <span id="valTitleFontSize" class="text-xs font-mono font-bold text-blue-600">12.5 pt</span>
                                </div>
                                <input type="range" id="titleFontSize" min="6" max="16" step="0.5" value="12.5" 
                                    oninput="updateLabels()" class="w-full accent-blue-600">
                            </div>

                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-xs font-semibold text-slate-600">型號字級</label>
                                    <span id="valModelFontSize" class="text-xs font-mono font-bold text-blue-600">9.5 pt</span>
                                </div>
                                <input type="range" id="modelFontSize" min="5" max="14" step="0.5" value="9.5" 
                                    oninput="updateLabels()" class="w-full accent-blue-600">
                            </div>
                        </div>

                        <!-- Print Offsets for Printer Alignment -->
                        <div class="border-t border-slate-100 pt-3">
                            <span class="text-xs font-bold text-slate-700 block mb-2">印表機物理偏移校正 (mm)：</span>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <div class="flex justify-between items-center mb-1">
                                        <label class="text-xs text-slate-600">垂直偏移 (Y)</label>
                                        <span id="valOffsetY" class="text-xs font-mono font-bold text-blue-600">0 mm</span>
                                    </div>
                                    <input type="range" id="offsetY" min="-5" max="5" step="0.5" value="0" 
                                        oninput="updateLabels()" class="w-full accent-blue-600">
                                </div>

                                <div>
                                    <div class="flex justify-between items-center mb-1">
                                        <label class="text-xs text-slate-600">水平偏移 (X)</label>
                                        <span id="valOffsetX" class="text-xs font-mono font-bold text-blue-600">0 mm</span>
                                    </div>
                                    <input type="range" id="offsetX" min="-5" max="5" step="0.5" value="0" 
                                        oninput="updateLabels()" class="w-full accent-blue-600">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Preview Area (Screen & Print) -->
            <div class="lg:col-span-8 flex flex-col items-center">
                
                <!-- Preview Toolbar (Screen only) -->
                <div class="no-print w-full flex flex-wrap justify-between items-center bg-white p-3 rounded-xl border border-slate-200 mb-4 text-xs">
                    <div class="flex items-center gap-2">
                        <span class="font-semibold text-slate-600"><i class="fa-solid fa-hand-pointer text-blue-500"></i> 點擊單個格子可「停用」不列印（適用殘頁套印）</span>
                    </div>
                    <div class="flex items-center gap-2 mt-2 sm:mt-0">
                        <button onclick="toggleAllCells(true)" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition">全選</button>
                        <button onclick="toggleAllCells(false)" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition">全清</button>
                        <div class="h-4 w-px bg-slate-300 mx-1"></div>
                        <span class="text-slate-500">預覽縮放:</span>
                        <button onclick="setZoom(0.75)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-mono">75%</button>
                        <button onclick="setZoom(0.9)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-mono">90%</button>
                        <button onclick="setZoom(1.0)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-mono">100%</button>
                    </div>
                </div>

                <!-- Printable A4 Sheet -->
                <div class="a4-sheet" id="a4Sheet">
                    <div class="label-grid" id="labelGrid"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const TOTAL_LABELS = 48;
        let disabledCells = new Array(TOTAL_LABELS).fill(false);

        // 綁定固定的 Google 試算表網址 (固定抓取: G欄=名稱, E欄=型號)
        const DEFAULT_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1VOjSO8HnomJkcLU1w-qVNo3Adu42_QfOtDffvqsTviI/edit?gid=1182638674#gid=1182638674';
        const FIXED_TITLE_COL = 'G';
        const FIXED_MODEL_COL = 'E';

        // 固定出現的警語/提示標籤品項 (設定紅字標記)
        const FIXED_NOTICE_ITEM = { title: '⛔湯勺為不沾塗層，請使用海綿清洗 !', model: '', isRed: true };

        // 預設品項清單 (離線/備用) - 警語放置於最後一個選項
        let PRESET_PRODUCTS = [
            { title: '▉ 28cm千格紋輕量炒鍋', model: 'FN-511RRT' },
            { title: '▉ 33cm千格紋輕量炒鍋', model: 'FN-513RRT' },
            FIXED_NOTICE_ITEM
        ];

        // 轉換欄位字母為 0-based 索引 (A->0, E->4, G->6)
        function colToIdx(colStr) {
            if (!colStr) return 0;
            colStr = colStr.trim().toUpperCase();
            let sum = 0;
            for (let i = 0; i < colStr.length; i++) {
                sum = sum * 26 + (colStr.charCodeAt(i) - 64);
            }
            return sum - 1;
        }

        // Initialize grid on DOM load
        window.onload = function() {
            createGrid();
            loadSheetData(DEFAULT_SHEET_URL, true);
        };

        function createGrid() {
            const grid = document.getElementById('labelGrid');
            if (!grid) return;
            
            grid.innerHTML = '';

            for (let i = 0; i < TOTAL_LABELS; i++) {
                const cell = document.createElement('div');
                cell.className = 'label-cell';
                cell.id = `cell-${i}`;
                cell.onclick = () => toggleCell(i);

                const badge = document.createElement('span');
                badge.className = 'cell-badge';
                badge.innerText = `${i + 1}`;
                cell.appendChild(badge);

                const content = document.createElement('div');
                content.className = 'label-content';
                content.id = `content-${i}`;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'label-title';
                titleSpan.id = `title-${i}`;

                const modelSpan = document.createElement('span');
                modelSpan.className = 'label-model';
                modelSpan.id = `model-${i}`;

                content.appendChild(titleSpan);
                content.appendChild(modelSpan);
                cell.appendChild(content);

                grid.appendChild(cell);
            }
        }

        function updateLabels() {
            const titleVal = document.getElementById('inputTitle').value || '';
            const rawModelVal = document.getElementById('inputModel').value || '';
            const modelVal = rawModelVal.trim() !== '' ? `(${rawModelVal})` : '';

            const titleFontSize = document.getElementById('titleFontSize').value;
            const modelFontSize = document.getElementById('modelFontSize').value;
            const offsetY = document.getElementById('offsetY').value;
            const offsetX = document.getElementById('offsetX').value;

            document.getElementById('valTitleFontSize').innerText = `${titleFontSize} pt`;
            document.getElementById('valModelFontSize').innerText = `${modelFontSize} pt`;
            document.getElementById('valOffsetY').innerText = `${offsetY > 0 ? '+' : ''}${offsetY} mm`;
            document.getElementById('valOffsetX').innerText = `${offsetX > 0 ? '+' : ''}${offsetX} mm`;

            document.documentElement.style.setProperty('--title-font-size', `${titleFontSize}pt`);
            document.documentElement.style.setProperty('--model-font-size', `${modelFontSize}pt`);
            document.documentElement.style.setProperty('--offset-y', `${offsetY}mm`);
            document.documentElement.style.setProperty('--offset-x', `${offsetX}mm`);

            // 判斷是否為警告提示文字（使用標記或關鍵字判斷）
            const selectedIdx = parseInt(document.getElementById('productSelect').value, 10);
            const selectedProd = PRESET_PRODUCTS[selectedIdx];
            const isRedText = (selectedProd && selectedProd.isRed) || titleVal.includes('湯勺為不沾塗層');

            for (let i = 0; i < TOTAL_LABELS; i++) {
                const titleEl = document.getElementById(`title-${i}`);
                const modelEl = document.getElementById(`model-${i}`);
                if (titleEl) {
                    titleEl.innerText = titleVal;
                    if (isRedText) {
                        titleEl.classList.add('is-red-text');
                    } else {
                        titleEl.classList.remove('is-red-text');
                    }
                }
                if (modelEl) modelEl.innerText = modelVal;
            }
        }

        function toggleCell(index) {
            disabledCells[index] = !disabledCells[index];
            const cell = document.getElementById(`cell-${index}`);
            if (cell) {
                if (disabledCells[index]) {
                    cell.classList.add('disabled');
                } else {
                    cell.classList.remove('disabled');
                }
            }
        }

        function toggleAllCells(enable) {
            for (let i = 0; i < TOTAL_LABELS; i++) {
                disabledCells[i] = !enable;
                const cell = document.getElementById(`cell-${i}`);
                if (cell) {
                    if (!enable) {
                        cell.classList.add('disabled');
                    } else {
                        cell.classList.remove('disabled');
                    }
                }
            }
        }

        function resetDefaults() {
            document.getElementById('productSelect').value = '0';
            if (PRESET_PRODUCTS.length > 0) {
                document.getElementById('inputTitle').value = PRESET_PRODUCTS[0].title || '';
                document.getElementById('inputModel').value = PRESET_PRODUCTS[0].model || '';
            } else {
                document.getElementById('inputTitle').value = FIXED_NOTICE_ITEM.title;
                document.getElementById('inputModel').value = FIXED_NOTICE_ITEM.model;
            }
            document.getElementById('titleFontSize').value = 12.5;
            document.getElementById('modelFontSize').value = 9.5;
            document.getElementById('offsetY').value = 0;
            document.getElementById('offsetX').value = 0;
            disabledCells = new Array(TOTAL_LABELS).fill(false);
            
            for (let i = 0; i < TOTAL_LABELS; i++) {
                const cell = document.getElementById(`cell-${i}`);
                if (cell) cell.classList.remove('disabled');
            }
            
            updateLabels();
        }

        function setZoom(scale) {
            document.documentElement.style.setProperty('--preview-scale', scale);
        }

        function renderProductDropdown() {
            const select = document.getElementById('productSelect');
            if (!select) return;
            select.innerHTML = '';
            PRESET_PRODUCTS.forEach((prod, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = prod.model ? `${prod.title} (型號:${prod.model})` : prod.title;
                select.appendChild(opt);
            });
        }

        // 使用 JSONP 載入以繞過本機 (file://) 的 CORS 跨域限制
        function fetchSheetJSONP(sheetId, gid) {
            return new Promise((resolve, reject) => {
                const callbackName = 'gviz_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                const script = document.createElement('script');
                
                const timer = setTimeout(() => {
                    cleanup();
                    reject(new Error('連線逾時！請確認 Google 試算表共用權限已設定為「知道連結的人皆可檢視」'));
                }, 8000);

                function cleanup() {
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    if (timer) clearTimeout(timer);
                }

                window[callbackName] = function(data) {
                    cleanup();
                    if (data && data.status === 'error') {
                        reject(new Error('試算表讀取錯誤，請確認共用權限與頁面識別碼 (gid)'));
                    } else if (data && data.table) {
                        resolve(data.table);
                    } else {
                        reject(new Error('資料格式解析失敗'));
                    }
                };

                let url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}&headers=0`;
                if (gid) url += `&gid=${gid}`;
                // 加入時間戳記防快取 (Cache Buster)
                url += `&_=${Date.now()}`;

                script.src = url;
                script.onerror = function() {
                    cleanup();
                    reject(new Error('無法存取雲端試算表，請檢查網路連線或網址格式'));
                };

                document.body.appendChild(script);
            });
        }

        function extractSheetInfo(input) {
            if (!input) return { sheetId: '', gid: '' };
            const idMatch = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
            const gidMatch = input.match(/[?&#]gid=([0-9]+)/);
            
            return {
                sheetId: idMatch ? idMatch[1] : input.trim(),
                gid: gidMatch ? gidMatch[1] : ''
            };
        }

        async function reloadSheetData() {
            const statusEl = document.getElementById('sheetStatusText');
            if (statusEl) {
                statusEl.innerText = '正在重新載入資料...';
                statusEl.className = "text-[11px] text-blue-600 font-medium mt-1 block";
            }
            await loadSheetData(DEFAULT_SHEET_URL, false);
        }

        async function loadSheetData(sheetInput, isAutoLoad) {
            const { sheetId, gid } = extractSheetInfo(sheetInput);
            const titleIdx = colToIdx(FIXED_TITLE_COL);
            const modelIdx = colToIdx(FIXED_MODEL_COL);

            if (!sheetId) {
                const statusEl = document.getElementById('sheetStatusText');
                if (statusEl) {
                    statusEl.innerText = '無法辨識試算表 ID';
                    statusEl.className = "text-[11px] text-red-500 font-medium mt-1 block";
                }
                return;
            }

            try {
                const table = await fetchSheetJSONP(sheetId, gid);
                const rows = table.rows || [];
                const newProducts = [];

                // 智慧掃描所有資料列，自動識別過濾表頭（如「細目」、「型號」）與空白列
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || !row.c) continue;

                    const titleCell = row.c[titleIdx];
                    const modelCell = row.c[modelIdx];

                    const getVal = (cell) => {
                        if (!cell) return '';
                        if (cell.f !== null && cell.f !== undefined) return String(cell.f).trim();
                        if (cell.v !== null && cell.v !== undefined) return String(cell.v).trim();
                        return '';
                    };

                    const title = getVal(titleCell);
                    const model = getVal(modelCell);

                    // 自動跳過空白列與表頭欄位名稱
                    if (!title && !model) continue;
                    if (title === '細目' || model === '型號' || title === '產品名稱') continue;

                    // 避免重複加入固定警語品項
                    if (title === FIXED_NOTICE_ITEM.title) continue;

                    newProducts.push({ title: title || '未命名商品', model });
                }

                // 將固定警語品項放在清單的最後一個選項
                newProducts.push(FIXED_NOTICE_ITEM);

                PRESET_PRODUCTS = newProducts;
                
                renderProductDropdown();
                handleProductSelect(0);
                
                const statusEl = document.getElementById('sheetStatusText');
                if (statusEl) {
                    statusEl.innerText = `已成功載入雲端試算表 (共 ${newProducts.length} 筆資料，含固定常用品項)`;
                    statusEl.className = "text-[11px] text-emerald-600 font-medium mt-1 block";
                }

            } catch (err) {
                console.error(err);
                const statusEl = document.getElementById('sheetStatusText');
                if (statusEl) {
                    statusEl.innerText = `連線失敗：${err.message || '請確認網路連線或試算表共用權限'}`;
                    statusEl.className = "text-[11px] text-red-500 font-medium mt-1 block";
                }
                renderProductDropdown();
                handleProductSelect(0);
            }
        }

        function handleProductSelect(indexVal) {
            const idx = parseInt(indexVal, 10);
            if (isNaN(idx) || idx < 0 || idx >= PRESET_PRODUCTS.length) return;
            const prod = PRESET_PRODUCTS[idx];
            if (prod) {
                document.getElementById('inputTitle').value = prod.title || '';
                document.getElementById('inputModel').value = prod.model || '';
                updateLabels();
            }
        }
    </script>
</body>
</html>
